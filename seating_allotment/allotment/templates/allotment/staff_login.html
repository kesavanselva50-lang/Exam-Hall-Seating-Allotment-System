<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | OneClick Seating Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top left, #4f46e5, #7e22ce, #1e1b4b);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-field {
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s ease-in-out;
        }

        .input-field:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            background: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.4);
        }

        /* Sophisticated Logo Animation */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1) rotate(3deg); }
            50% { opacity: 0.9; transform: scale(1.02) rotate(5deg); }
        }

        .logo-container {
            animation: pulse-soft 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="flex items-center justify-center p-6">

<div class="glass-card w-full max-w-5xl flex flex-col md:flex-row overflow-hidden">
        
    <div class="hidden md:flex flex-1 bg-slate-50 items-center justify-center p-12 relative overflow-hidden border-r border-slate-100">
        <div class="absolute top-0 left-0 w-full h-full opacity-[0.03]" style="background-image: radial-gradient(#4f46e5 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <div class="relative z-10 text-center">
            <div class="logo-container w-24 h-24 mx-auto mb-8 relative">
                <div class="absolute inset-0 bg-indigo-600 blur-2xl opacity-20"></div>
                <svg viewBox="0 0 100 100" class="w-full h-full relative z-10 drop-shadow-2xl">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="180 100" />
                    <rect x="35" y="35" width="30" height="30" rx="8" fill="#4f46e5" />
                    <circle cx="50" cy="45" r="8" fill="white" />
                    <path d="M38 60 Q50 55 62 60" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" />
                    
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h3 class="text-3xl font-extrabold text-slate-800 tracking-tight">OneClick</h3>
            <span class="text-sm font-bold text-indigo-600 uppercase tracking-[0.3em]">Seating System</span>
            
            <p class="text-slate-500 mt-6 max-w-xs mx-auto text-sm leading-relaxed font-medium">
                The next generation of automated exam hall and faculty allocation.
            </p>
        </div>
    </div>

    <div class="flex-[1.2] p-8 md:p-16 bg-white">
        <div class="mb-10">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Staff Portal</h2>
            <p class="text-slate-500 mt-2 text-sm font-medium">Please sign in to access your dashboard.</p>
        </div>

        <form method="POST" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider ml-1">Staff Id</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input type="text" name="staff_id" required placeholder="EMP-101"
                           class="w-full input-field rounded-xl py-3.5 pl-12 pr-4 outline-none text-slate-700 placeholder:text-slate-400 font-medium">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider ml-1">Security Key</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full input-field rounded-xl py-3.5 pl-12 pr-4 outline-none text-slate-700 placeholder:text-slate-400">
                </div>
            </div>

            <div class="flex items-center justify-end">
                <a href="{% url 'staff_forgot' %}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                    Forgot Access?
                </a>
            </div>

            <button type="submit"
                    class="btn-primary w-full text-white font-bold py-4 rounded-xl text-sm uppercase tracking-widest shadow-lg mt-2">
                    Sign In to Dashboard
            </button>
        </form>

        <div class="mt-12 pt-8 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-500 font-medium">
                New Registration?
                <a href="{% url 'staff_register' %}" class="text-indigo-600 font-bold hover:underline ml-1">
                    Register Staff Account
                </a>
            </p>
        </div>
    </div>
</div>

<footer class="fixed bottom-6 text-white/50 text-xs font-medium tracking-wide">
    &copy; 2026 OneClick Seating Management System.
</footer>

</body>
</html>
