{% extends "base.html" %}
{% block title %}Master Upload | ONECLICK{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center p-6">

    <div class="bg-white rounded-[3rem] shadow-2xl shadow-slate-200 border border-slate-100 w-full max-w-2xl overflow-hidden">
        
        <div class="p-10 bg-slate-900 relative overflow-hidden">
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>
            
            <div class="relative z-10 flex items-center gap-6">
                <div class="h-16 w-16 bg-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-white uppercase tracking-tight">Upload Records</h2>
                    <p class="text-indigo-300/60 text-[10px] font-black uppercase tracking-[0.2em]">Batch Data Injection Engine</p>
                </div>
            </div>
        </div>

        <div class="p-10 space-y-8">
            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <div class="group relative">
                    <label class="flex flex-col items-center justify-center w-full h-48 border-4 border-dashed border-slate-100 rounded-[2rem] bg-slate-50/50 cursor-pointer hover:bg-slate-50 hover:border-indigo-300 transition-all duration-300">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-10 h-10 mb-3 text-slate-400 group-hover:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <p class="text-sm font-black text-slate-500 uppercase tracking-widest">Drop Master .XLSX File</p>
                            <p class="text-[10px] text-slate-400 font-bold mt-1">Maximum payload: 25MB</p>
                        </div>
                        <input type="file" name="excel_file" accept=".xlsx" class="hidden" required id="file-upload">
                    </label>
                    <div id="file-name" class="mt-3 text-center text-xs font-black text-indigo-600 uppercase tracking-tighter"></div>
                </div>

                <button type="submit"
                        class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black shadow-xl shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-1 active:scale-95 transition-all flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    EXECUTE MASTER SYNC
                </button>
            </form>

           
            </div>
        </div>


    </div>

</div>

<script>
    document.getElementById('file-upload').onchange = function() {
        document.getElementById('file-name').innerHTML = "Selected: " + this.files[0].name;
    };
</script>
{% endblock %}
